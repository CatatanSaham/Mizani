name: 'Android CI'

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build debug APK and run JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            gradle/wrapper/gradle-wrapper.properties
            gradle/libs.versions.toml
            gradle.properties
            settings.gradle.kts
            build.gradle.kts
            app/build.gradle.kts
            shared/build.gradle.kts

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''

      # This project's installed SDK uses the versioned API 37.0 package path.
      - name: Install Android 17 API 37.0 platform
        run: android sdk install --canary platforms/android-37.0

      - name: Build and test
        run: bash ./gradlew --no-daemon :shared:testAndroidHostTest :app:testDebugUnitTest :app:assembleDebug

      - name: Publish debug APK to apk-build branch
        if: github.event_name == 'push'
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p /tmp/apkrepo
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/apkrepo/Mizani-debug.apk
          cd /tmp/apkrepo
          git init -q -b apk-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mizani-debug.apk
          git commit -q -m "Debug APK from ${GITHUB_SHA}"
          git push -f -q "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-build:apk-build
